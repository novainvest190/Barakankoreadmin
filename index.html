<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Panel — Joshua Baraka Tickets</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #ffffff; --bg-soft: #f7f7f8; --text: #111111; --text-soft: #6b7280;
    --border: #e5e7eb; --success: #10b981; --danger: #ef4444;
    --whatsapp: #25D366; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; line-height: 1.5; }
  h1, h2, h3, h4 { font-family: 'Heebo', system-ui, sans-serif; font-weight: 700; }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 1rem; }

  header { border-bottom: 1px solid var(--border); background: #fff; position: sticky; top: 0; z-index: 100; }
  .header-inner { display: flex; align-items: center; justify-content: space-between; padding: 1rem 0; gap: 1rem; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 0.5rem; font-family: 'Heebo', sans-serif; font-weight: 800; font-size: 1.125rem; }
  .brand-mark { width: 2rem; height: 2rem; border-radius: 0.5rem; background: #111; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.875rem; }
  .brand .sub { color: var(--text-soft); font-weight: 500; font-size: 0.8125rem; }
  .conn-status { display: inline-flex; align-items: center; gap: 0.375rem; font-size: 0.75rem; font-weight: 600; color: var(--text-soft); padding: 0.375rem 0.75rem; background: var(--bg-soft); border-radius: 999px; }
  .conn-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: #d1d5db; transition: all .2s; }
  .conn-dot.live { background: var(--success); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin: 1.5rem 0; }
  @media (min-width: 640px) { .stats { grid-template-columns: repeat(4, 1fr); } }
  .stat { border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; background: #fff; }
  .stat-label { font-size: 0.6875rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-soft); margin-bottom: 0.375rem; }
  .stat-value { font-family: 'Heebo', sans-serif; font-size: 1.5rem; font-weight: 800; }

  .verify-box { border: 2px solid #111; border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1.5rem; }
  .verify-label { font-size: 0.6875rem; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 0.5rem; }
  .verify-row { display: flex; gap: 0.5rem; }
  .verify-input { flex: 1; padding: 0.875rem 1rem; border: 2px solid var(--border); border-radius: 0.75rem; font-size: 1rem; font-family: 'Heebo', monospace; letter-spacing: 0.05em; outline: none; transition: all .2s; min-width: 0; }
  .verify-input:focus { border-color: #111; box-shadow: 0 0 0 3px rgba(17,17,17,0.08); }
  .verify-btn { background: #111; color: #fff; padding: 0.875rem 1.5rem; border-radius: 0.75rem; font-weight: 700; font-size: 0.9375rem; transition: all .2s; border: none; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .verify-btn:hover { background: #000; }
  .verify-result { margin-top: 1rem; padding: 1rem; border-radius: var(--radius); display: none; font-size: 0.9375rem; }
  .verify-result.valid { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; display: block; }
  .verify-result.invalid { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; display: block; }
  .verify-result strong { font-weight: 800; }
  .verify-result .details { margin-top: 0.5rem; font-size: 0.8125rem; line-height: 1.6; opacity: 0.9; }

  .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; align-items: center; }
  .filters input, .filters select { padding: 0.625rem 0.875rem; border: 1px solid var(--border); border-radius: 0.5rem; font-size: 0.875rem; outline: none; font-family: inherit; }
  .filters input:focus, .filters select:focus { border-color: #111; }
  .btn { padding: 0.625rem 1rem; border-radius: 0.5rem; font-size: 0.8125rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--text); transition: all .2s; font-family: inherit; }
  .btn:hover { background: var(--bg-soft); }

  .table-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
  thead { background: var(--bg-soft); }
  th { text-align: left; padding: 0.75rem 1rem; font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-soft); border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 0.875rem 1rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .code-cell { font-family: 'Heebo', monospace; font-weight: 700; color: #111; }
  .status-pill { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 999px; font-size: 0.625rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
  .status-valid { background: #ecfdf5; color: #065f46; }
  .status-used { background: #fef2f2; color: #991b1b; }

  .wa-btn { display: inline-flex; align-items: center; gap: 0.25rem; background: var(--whatsapp); color: #fff; padding: 0.375rem 0.625rem; border-radius: 999px; font-size: 0.6875rem; font-weight: 700; text-decoration: none; white-space: nowrap; transition: transform .2s; }
  .wa-btn:hover { transform: scale(1.05); }
  .wa-btn svg { width: 12px; height: 12px; }

  .empty { padding: 3rem 1rem; text-align: center; color: var(--text-soft); font-size: 0.9375rem; }
  .empty-icon { font-size: 2.5rem; margin-bottom: 0.5rem; opacity: 0.4; }

  @media (max-width: 768px) { table { font-size: 0.75rem; } th, td { padding: 0.5rem 0.625rem; } .hide-mobile { display: none; } }
</style>
</head>
<body>

<header>
  <div class="container header-inner">
    <div class="brand">
      <span class="brand-mark">A</span>
      <div>ADMIN<br /><span class="sub">Joshua Baraka — Ticket control</span></div>
    </div>
    <div style="display:flex; gap:0.5rem; align-items:center;">
      <span class="conn-status"><span class="conn-dot" id="connDot"></span><span id="connText">Connecting…</span></span>
      <a href="index.html" class="btn">← Ticket site</a>
    </div>
  </div>
</header>

<div class="container">
  <div class="stats">
    <div class="stat"><div class="stat-label">Total orders</div><div class="stat-value" id="statOrders">0</div></div>
    <div class="stat"><div class="stat-label">Tickets sold</div><div class="stat-value" id="statTickets">0</div></div>
    <div class="stat"><div class="stat-label">Revenue (UGX)</div><div class="stat-value" id="statRevenue">0</div></div>
    <div class="stat"><div class="stat-label">Checked in</div><div class="stat-value" id="statUsed">0</div></div>
  </div>

  <div class="verify-box">
    <div class="verify-label">🔍 Verify a ticket</div>
    <div class="verify-row">
      <input type="text" id="verifyInput" class="verify-input" placeholder="Enter ticket code e.g. JB-A3K9P2M4" autocomplete="off" spellcheck="false" />
      <button class="verify-btn" id="verifyBtn">Verify</button>
    </div>
    <div class="verify-result" id="verifyResult"></div>
  </div>

  <div class="filters">
    <input type="text" id="searchBox" placeholder="Search name, WhatsApp, code, email…" style="flex:1; min-width:200px;" />
    <select id="tierFilter">
      <option value="">All tiers</option>
      <option>Regular</option>
      <option>VIP</option>
      <option>VVIP / Table</option>
    </select>
    <select id="statusFilter">
      <option value="">All statuses</option>
      <option value="valid">Valid</option>
      <option value="used">Used</option>
    </select>
    <button class="btn" id="refreshBtn">↻ Reload</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Code</th>
          <th>Holder</th>
          <th>WhatsApp</th>
          <th class="hide-mobile">Email</th>
          <th>Tier</th>
          <th>Qty</th>
          <th class="hide-mobile">Txn ID</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="ordersBody"></tbody>
    </table>
  </div>

  <div class="empty" id="emptyState" style="display:none;">
    <div class="empty-icon">🎟️</div>
    <div>No orders yet. Tickets sold on the main site will appear here automatically.</div>
  </div>

  <div style="height:4rem;"></div>
</div>

<!-- FIREBASE SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<script>
/* ============ FIREBASE CONFIG ============ */
const firebaseConfig = {
  apiKey: "AIzaSyDpctifaksxZFoymFMPmkqxNfy2HOiKubg",
  authDomain: "baracktickets.firebaseapp.com",
  projectId: "baracktickets",
  storageBucket: "baracktickets.firebasestorage.app",
  messagingSenderId: "209541227277",
  appId: "1:209541227277:web:d267fd2a3f07f968724644",
  measurementId: "G-0NBP5Y8329"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let allOrders = [];
let firebaseReady = false;

/* LIVE LISTENER — updates instantly whenever anyone buys a ticket */
db.collection('orders').orderBy('ts', 'desc').onSnapshot(snapshot => {
  allOrders = snapshot.docs.map(doc => doc.data());
  firebaseReady = true;
  document.getElementById('connDot').classList.add('live');
  document.getElementById('connText').textContent = 'Live';
  render();
}, err => {
  console.error('Firebase listen error:', err);
  document.getElementById('connText').textContent = 'Offline';
  document.getElementById('connDot').classList.remove('live');
});

function formatUGX(n) { return 'USh' + Number(n).toLocaleString('en-UG'); }

function normalizePhone(p) {
  const digits = String(p || '').replace(/[^\d]/g, '');
  if (digits.startsWith('256')) return digits;
  if (digits.startsWith('0')) return '256' + digits.slice(1);
  return digits;
}

function render() {
  const orders = allOrders;
  const search = document.getElementById('searchBox').value.trim().toLowerCase();
  const tierFilter = document.getElementById('tierFilter').value;
  const statusFilter = document.getElementById('statusFilter').value;

  const totalTickets = orders.reduce((s, o) => s + (o.qty || 0), 0);
  const revenue = orders.reduce((s, o) => s + ((o.price || 0) * (o.qty || 0)), 0);
  const used = orders.filter(o => o.used).length;
  document.getElementById('statOrders').textContent = orders.length;
  document.getElementById('statTickets').textContent = totalTickets;
  document.getElementById('statRevenue').textContent = revenue.toLocaleString('en-UG');
  document.getElementById('statUsed').textContent = used;

  const filtered = orders.filter(o => {
    if (tierFilter && o.tier !== tierFilter) return false;
    if (statusFilter === 'valid' && o.used) return false;
    if (statusFilter === 'used' && !o.used) return false;
    if (search) {
      const hay = `${o.code||''} ${o.name||''} ${o.email||''} ${o.phone||''} ${o.txnId||''}`.toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  const body = document.getElementById('ordersBody');
  body.innerHTML = '';
  document.getElementById('emptyState').style.display = filtered.length === 0 ? 'block' : 'none';

  filtered.forEach(o => {
    const waNum = normalizePhone(o.phone);
    const waLink = `https://wa.me/${waNum}?text=${encodeURIComponent(`Hi ${o.name}, this is Isaac from Shooters Events. Confirming your ticket for Joshua Baraka Pop Up Party Mbarara (${o.code}).`)}`;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="code-cell">${o.code || '—'}</td>
      <td><strong>${o.name || '—'}</strong></td>
      <td>
        <div style="font-size:0.75rem; margin-bottom:0.25rem;">${o.phone || '—'}</div>
        ${waNum ? `<a href="${waLink}" target="_blank" rel="noopener" class="wa-btn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>Chat</a>` : ''}
      </td>
      <td class="hide-mobile" style="font-size:0.7rem;">${o.email || '—'}</td>
      <td>${o.tier || '—'}</td>
      <td>${o.qty || 0}</td>
      <td class="hide-mobile" style="font-family:monospace; font-size:0.7rem;">${o.txnId || '—'}</td>
      <td><span class="status-pill ${o.used ? 'status-used' : 'status-valid'}">${o.used ? 'USED' : 'VALID'}</span></td>
      <td>
        <button class="btn" data-toggle="${o.code}" style="padding:0.375rem 0.625rem; font-size:0.75rem;">
          ${o.used ? 'Reset' : 'Mark used'}
        </button>
      </td>
    `;
    body.appendChild(tr);
  });
}

/* VERIFY */
document.getElementById('verifyBtn').addEventListener('click', verifyTicket);
document.getElementById('verifyInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') verifyTicket();
});

async function verifyTicket() {
  const code = document.getElementById('verifyInput').value.trim().toUpperCase();
  const result = document.getElementById('verifyResult');
  if (!code) { result.className = 'verify-result'; result.style.display = 'none'; return; }

  const order = allOrders.find(o => (o.code || '').toUpperCase() === code);

  if (!order) {
    result.className = 'verify-result invalid';
    result.innerHTML = `<strong>❌ INVALID</strong><div class="details">No ticket found with code <strong>${code}</strong></div>`;
    return;
  }

  if (order.used) {
    result.className = 'verify-result invalid';
    result.innerHTML = `
      <strong>⚠️ ALREADY USED</strong>
      <div class="details">
        Code: <strong>${order.code}</strong><br>
        Holder: ${order.name}<br>
        WhatsApp: ${order.phone}<br>
        Tier: ${order.tier} × ${order.qty}<br>
        This ticket has already been checked in.
      </div>`;
    return;
  }

  result.className = 'verify-result valid';
  result.innerHTML = `
    <strong>✅ VALID — checked in</strong>
    <div class="details">
      Code: <strong>${order.code}</strong><br>
      Holder: ${order.name}<br>
      WhatsApp: ${order.phone}<br>
      Email: ${order.email}<br>
      Tier: ${order.tier} × ${order.qty}<br>
      Total paid: ${formatUGX((order.price || 0) * (order.qty || 0))}
    </div>`;

  try {
    await db.collection('orders').doc(order.code).update({ used: true, usedAt: Date.now() });
    console.log('✅ Marked as used in Firebase');
  } catch (err) {
    console.error('Update failed:', err);
  }
}

/* TOGGLE USED */
document.getElementById('ordersBody').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-toggle]');
  if (!btn) return;
  const code = btn.dataset.toggle;
  const order = allOrders.find(o => o.code === code);
  if (!order) return;
  try {
    const newUsed = !order.used;
    await db.collection('orders').doc(code).update({
      used: newUsed,
      usedAt: newUsed ? Date.now() : null
    });
  } catch (err) {
    console.error('Toggle failed:', err);
    alert('Could not update. Check internet.');
  }
});

['searchBox','tierFilter','statusFilter'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});

document.getElementById('refreshBtn').addEventListener('click', () => location.reload());
</script>
</body>
</html>
